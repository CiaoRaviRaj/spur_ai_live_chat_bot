version: "3.1"

services:
  postgres:
    image: postgres:15-alpine
    container_name: spur_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spur_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spur_password}
      POSTGRES_DB: ${POSTGRES_DB:-spur_db}
    ports:
      - "5440:5432"
    volumes:
      - spur_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spur_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - spur_redis_data:/data

volumes:
  spur_postgres_data:
  spur_redis_data:
